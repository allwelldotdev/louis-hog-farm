[project]
name = "hog-farm-backend"
version = "0.1.0"
description = "Hog Farm Monitoring API (FastAPI)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",
    "pyjwt==2.13.0",
    "python-multipart==0.0.17",
    "argon2-cffi==23.1.0",
    # python:3.12-slim does not ship /usr/share/zoneinfo, so ZoneInfo("Africa/Lagos")
    # resolves on the host and raises in the container. This carries the database.
    "tzdata==2026.3",
]

# Single source of truth for dependencies. uv.lock pins the resolved versions and
# is what both the local .venv and the Docker image install from; add new deps
# with `uv add`, never by hand-editing a parallel requirements file.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP042 rewrites `class X(str, Enum)` to `StrEnum`, which changes how
# SQLAlchemy's Enum(native_enum=False) resolves stored values. Left alone
# deliberately; revisit alongside the schema pass that touches these enums.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# Calling Query/Depends/Path/Body/Header in a parameter default is the FastAPI
# idiom, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# The backend dir is the import root; without this `app` is not importable
# because there is no installed package.
pythonpath = ["."]
